<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotTrack - Redirection...</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 50px; margin-top: 20px;}
        h2 { color: #4CAF50; }
        .btn { display: inline-block; padding: 15px 25px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 30px; }
    </style>
</head>
<body>
    <h2>📍 Ouverture de SpotTrack...</h2>
    <p>La carte est en train de se centrer sur le spot.</p>
    <p>Si l'application ne s'ouvre pas automatiquement, cliquez sur le bouton ci-dessous :</p>
    
    <a id="appLink" href="#" class="btn">Ouvrir le Spot</a>

    <script>
        // 1. On récupère les coordonnées envoyées dans le lien web
        const queryString = window.location.search;
        
        // CORRECTION ICI : On a enlevé le mot "share" pour que l'appli s'ouvre sur l'écran principal (la racine)
        const deepLink = "spottrack://" + queryString;
        
        // 3. On sécurise le bouton de secours
        document.getElementById('appLink').href = deepLink;
        
        // 4. On lance la redirection automatique vers l'application
        setTimeout(() => {
            window.location.replace(deepLink);
        }, 500); 
    </script>
</body>
</html>
